<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>abcjs-fx — local example</title>
  <!-- abcjs from the CDN, abcjs-fx from the local sources -->
  <script src="https://cdn.jsdelivr.net/npm/abcjs@6.7.2/dist/abcjs-basic-min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/abcjs@6.7.2/abcjs-audio.css">
  <script src="../src/abcjs-fx.js"></script>
  <script src="../src/chord-library.js"></script>
  <script src="../src/abcjs-fx-diagrams.js"></script>
  <style>
    body { max-width: 960px; margin: 0 auto; padding: 16px; font-family: system-ui, sans-serif; }
  </style>
</head>
<body>
  <h1>abcjs-fx — local example</h1>
  <p>Serve the repository root with a static server (scripts are not loaded from <code>file://</code>),
     e.g. <code>python -m http.server</code>, then open <code>/examples/</code>.</p>

  <h2>Player</h2>
  <textarea data-abcjs-fx>
X:1
T:Au clair de la lune
M:4/4
L:1/4
K:C
"C"C C C D | "G7"E2 D2 | "C"C E "G7"D D | "C"C4 |]
  </textarea>

  <h2>Chord diagrams (extension)</h2>
  <textarea data-abcjs-fx chord-diagrams="ukulele">
X:1
T:I – vi – IV – V
M:4/4
L:1/4
K:C
"C"c2 e2 | "Am"A2 c2 | "F"F2 A2 | "G7"G2 B2 | "C"c4 |]
  </textarea>
</body>
</html>
